<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .prediction-result {
            margin-top: 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .error-message {
            color: #dc3545;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Student Grade Prediction</h1>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        {% if error %}
                        <div class="error-message text-center mb-4">
                            {{ error }}
                        </div>
                        {% endif %}
                        <form method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="attendance_rate" class="form-label">Attendance Rate (%)</label>
                                    <input type="number" step="0.01" class="form-control" id="attendance_rate" name="attendance_rate" required min="0" max="100">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="assignment_score" class="form-label">Assignment Score Average</label>
                                    <input type="number" step="0.01" class="form-control" id="assignment_score" name="assignment_score" required min="0" max="100">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="quiz_score" class="form-label">Quiz Score Average</label>
                                    <input type="number" step="0.01" class="form-control" id="quiz_score" name="quiz_score" required min="0" max="100">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="midterm_score" class="form-label">Midterm Score</label>
                                    <input type="number" step="0.01" class="form-control" id="midterm_score" name="midterm_score" required min="0" max="100">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="participation_level" class="form-label">Participation Level (1-5)</label>
                                    <input type="number" class="form-control" id="participation_level" name="participation_level" required min="1" max="5">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="study_hours" class="form-label">Study Hours per Week</label>
                                    <input type="number" step="0.1" class="form-control" id="study_hours" name="study_hours" required min="0" max="40">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="sleep_hours" class="form-label">Sleep Hours per Night</label>
                                    <input type="number" step="0.1" class="form-control" id="sleep_hours" name="sleep_hours" required min="0" max="12">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="parental_education" class="form-label">Parental Education Level</label>
                                    <select class="form-select" id="parental_education" name="parental_education" required>
                                        <option value="HighSchool">High School</option>
                                        <option value="Bachelors">Bachelor's Degree</option>
                                        <option value="Masters">Master's Degree</option>
                                        <option value="PhD">PhD</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label d-block">Internet Access</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="internet_access" id="internet_yes" value="Yes" required>
                                        <label class="form-check-label" for="internet_yes">Yes</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="internet_access" id="internet_no" value="No">
                                        <label class="form-check-label" for="internet_no">No</label>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label d-block">Extracurricular Activities</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="extracurricular" id="extra_yes" value="Yes" required>
                                        <label class="form-check-label" for="extra_yes">Yes</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="extracurricular" id="extra_no" value="No">
                                        <label class="form-check-label" for="extra_no">No</label>
                                    </div>
                                </div>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">Predict Final Grade</button>
                            </div>
                        </form>

                        {% if prediction is not none %}
                        <div class="prediction-result text-center mt-4">
                            <h4>Predicted Final Grade:</h4>
                            <h2 class="text-primary">{{ prediction }}/100</h2>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
